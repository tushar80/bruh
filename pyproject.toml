[project]
name = "bruh"
version = "0.1.0"
description = "A minimal coding agent over chat completions and messages APIs"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
bruh = "bruh.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bruh"]