[project]
name = "simple-agent"
version = "0.1.0"
description = "A simple pi-style coding agent powered by opencode-go (glm-5.2)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
simple-agent = "simple_agent.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_agent"]
